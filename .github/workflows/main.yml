name: Workflow to upload apk and ipa to TestApp.io app distribution
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get sample .apk for test purposes
        run: curl -fsSL --max-time 60 -o sample-app.apk https://github.com/testappio/fastlane-plugin-testappio/raw/main/fastlane/sample/sample-app.apk
      - name: Upload .apk artifact to TestApp.io app distribution
        uses: ./
        with:
          api_token: ${{secrets.TESTAPPIO_API_TOKEN}}
          app_id: ${{secrets.TESTAPPIO_APP_ID}}
          file: sample-app.apk
          git_release_notes: true
          include_git_commit_id: true
          release_notes: "Action CI test"
          notify: false

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get sample .ipa for test purposes
        run: curl -fsSL --max-time 60 -o sample-app.ipa https://github.com/testappio/fastlane-plugin-testappio/raw/main/fastlane/sample/sample-app.ipa
      - name: Upload .ipa artifact to TestApp.io app distribution
        uses: ./
        with:
          api_token: ${{secrets.TESTAPPIO_API_TOKEN}}
          app_id: ${{secrets.TESTAPPIO_APP_ID}}
          file: sample-app.ipa
          git_release_notes: false
          include_git_commit_id: false
          release_notes: "Action CI test"
          notify: false
